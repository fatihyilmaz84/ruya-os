name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs a secret or write access.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors the `dev.ps1` steps "text lint" and "token lint". Outside the Fedora container: pwsh is on the runner.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Text lint
        run: pwsh -NoProfile -File scripts/lint-text.ps1
      - name: Token lint
        run: pwsh -NoProfile -File scripts/lint-tokens.ps1
      - name: Translation lint
        run: pwsh -NoProfile -File scripts/lint-translations.ps1
      - name: Board lint
        run: pwsh -NoProfile -File scripts/lint-board.ps1
      - name: Test lint
        run: pwsh -NoProfile -File scripts/lint-tests.ps1

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as the dev host (dev-setup.md), so clippy here and in dev.ps1 knows the
      # same lints. Bump both together.
      - run: rustup toolchain install 1.92.0 --profile minimal -c clippy,rustfmt && rustup default 1.92.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  shell:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: dnf -y install --setopt=install_weak_deps=False cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel qt6-qttools-devel qt6-linguist
      - name: Build
        run: cmake -S shell -B shell/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build shell/build
      - name: qmllint
        # Direct call: the all_qmllint target does not fail on warnings; --max-warnings 0 does.
        run: /usr/lib64/qt6/bin/qmllint --max-warnings 0 @shell/build/.rcc/qmllint/ruyashell.rsp
      - name: Qt Quick tests
        # offscreen uses the software renderer: effects are skipped, focus/flow logic is tested.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir shell/build --output-on-failure

  # A full bootc build, a qcow2 and a boot under KVM: 16-22 minutes in the first runs. It runs on
  # every push and pull request: it is free on a public repository, the concurrency group cancels
  # superseded runs, and it is the only check that the image still boots with RUYA_BOOT_OK.
  image:
    runs-on: ubuntu-24.04
    needs: [lint, services, shell]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build bootc image
        run: scripts/build.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"

      - name: Build qcow2
        run: scripts/make-disk.sh qcow2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          # Let the runner user use KVM.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test
        run: scripts/smoke-test.sh output/qcow2/disk.qcow2 600

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: output/serial.log
          if-no-files-found: ignore
