name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    runs-on: ubuntu-24.04
    needs: services
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build bootc image
        run: scripts/build.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"

      - name: Build qcow2
        run: scripts/make-disk.sh qcow2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          # Let the runner user use KVM.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test
        run: scripts/smoke-test.sh output/qcow2/disk.qcow2 600

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: output/serial.log
          if-no-files-found: ignore
