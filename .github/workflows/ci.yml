name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  shell:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: dnf -y install --setopt=install_weak_deps=False cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel
      - name: Build
        run: cmake -S shell -B shell/build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build shell/build
      - name: qmllint
        # Direct call: the all_qmllint target does not fail on warnings; --max-warnings 0 does.
        run: /usr/lib64/qt6/bin/qmllint --max-warnings 0 @shell/build/.rcc/qmllint/ruyashell.rsp
      - name: Qt Quick tests
        # offscreen uses the software renderer: effects are skipped, focus/flow logic is tested.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir shell/build --output-on-failure

  image:
    runs-on: ubuntu-24.04
    needs: [services, shell]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build bootc image
        run: scripts/build.sh "0.0.0-ci.${GITHUB_RUN_NUMBER}"

      - name: Build qcow2
        run: scripts/make-disk.sh qcow2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          # Let the runner user use KVM.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test
        run: scripts/smoke-test.sh output/qcow2/disk.qcow2 600

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: output/serial.log
          if-no-files-found: ignore
