[package]
name = "ruya-library"
description = "RuyaOS library: installed games and apps (Steam, Flatpak) as one list (org.ruyaos.Library1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
blocking = "1"  # runs the scan (file and process I/O) off the executor; already in the tree through zbus

[dev-dependencies]
tempfile = "3"
