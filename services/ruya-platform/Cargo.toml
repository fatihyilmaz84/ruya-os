[package]
name = "ruya-platform"
description = "RuyaOS Platform: the one door for sandboxed apps (org.ruyaos.Platform1, ADR-022): caller identity from the connection, per-profile permissions, rate limits, capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ruya-ids = { path = "../ruya-ids" }  # the one profile-id rule and profile user name (RUY-1008)
ruya-flatpak = { path = "../ruya-flatpak" }  # the app-id grammar and the instance scope (RUY-1098)
ruya-keyfile = { path = "../ruya-keyfile" }  # the one keyfile reader: the caller's .flatpak-info (RUY-1050)
ruya-fs = { path = "../ruya-fs" }  # the permission files and the caller's .flatpak-info, never through a link (RUY-911)
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # the per-profile permission files (already in the tree)
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"  # the Profiles1 retry timer; already in the tree through zbus

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"  # getpwuid_r and getpwnam_r for the caller's and the shell's user (already in the tree)

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
