[package]
name = "ruya-platform"
description = "RuyaOS Platform: the one door for sandboxed apps (org.ruyaos.Platform1, ADR-022): caller identity from the connection, per-profile permissions, rate limits, capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ruya-ids = { path = "../ruya-ids" }  # the one profile-id rule and profile user name (RUY-1008)
ruya-flatpak = { path = "../ruya-flatpak" }  # the app-id grammar and the instance scope (RUY-1098)
ruya-keyfile = { path = "../ruya-keyfile" }  # the one keyfile reader: the caller's .flatpak-info (RUY-1050)
ruya-users = { path = "../ruya-users" }  # the caller's user name and the ruya-shell uid (RUY-1098)
ruya-profiles-client = { path = "../ruya-profiles-client" }  # following Profiles1 (RUY-1098)
ruya-fs = { path = "../ruya-fs" }  # the permission files, never through a link (RUY-911)
ruya-platform-identify = { path = "../ruya-platform-identify" }  # the identity helper's wire and the fdinfo rule (ADR-022 decision 4, RUY-1129)
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # the per-profile permission files (already in the tree)
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"  # the deadline of a Stopping's wait; already in the tree through zbus
async-channel = "2"  # the answer to a Stopping's wait (one per waiter); already in the tree through zbus

# The developer harness (RUY-158): the mock module and its two binaries. Off by default, so the
# service the image builds (`cargo build --release`) contains none of it; dev.ps1 and CI build
# and test with `--features dev-mock`.
ruya-contract-test = { path = "../ruya-contract-test", optional = true }  # the conformance runner reads the contract's comments with the one XML reader
libc = { version = "0.2", optional = true }  # the mock removes its state on SIGTERM (sigwait); already in the tree through ruya-users

[target.'cfg(target_os = "linux")'.dependencies]
# The identity helper's SOCK_SEQPACKET socket with the pidfd as SCM_RIGHTS (HelperProcfs), a safe
# API (linux_raw); already in the tree (ruya-fs, async-io), the net feature adds no crate.
rustix = { version = "1", default-features = false, features = ["std", "net"] }

[features]
dev-mock = ["dep:ruya-contract-test", "dep:libc"]

[[bin]]
name = "ruya-platform"
path = "src/main.rs"

[[bin]]
name = "ruya-platform-mock"
path = "src/bin/ruya-platform-mock.rs"
required-features = ["dev-mock"]

[[bin]]
name = "ruya-platform-conformance"
path = "src/bin/ruya-platform-conformance/main.rs"
required-features = ["dev-mock"]

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
