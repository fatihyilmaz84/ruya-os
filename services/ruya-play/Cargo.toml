[package]
name = "ruya-play"
description = "RuyaOS .play importer: org.ruyaos.Play1, jobs, staging, unpack, verify, art vetting and the Flatpak commit (docs/specs/05-play-packages.md section 7)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ruya-play-format = { path = "../ruya-play-format" }  # the one parser: Source, validate, Problem
ruya-play-trust = { path = "../ruya-play-trust" }  # inspect, tiers, continuity, revocation
ruya-play-art = { path = "../ruya-play-art" }  # art and video vetting
ruya-flatpak = { path = "../ruya-flatpak" }  # the override reset command line the Store runs too
serde = { version = "1", features = ["derive"] }  # the jobs and installed-builds state files
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }  # org.ruyaos.Play1 (as every service)
futures-lite = "2"  # block_on for the bus connection (already in the tree through zbus)
blocking = "1"  # Inspect and ListSources off the executor (already in the tree through zbus)
async-channel = "2"  # job events from the runner thread to the signal emitter (already in the tree through zbus)

[target.'cfg(unix)'.dependencies]
# Directory file descriptors: openat/mkdirat/symlinkat with O_NOFOLLOW, fchmod, fstatvfs (already in the tree).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
flate2 = "1"  # the format crate's zip fixture writer (already in the tree)
image = { version = "0.25", default-features = false, features = ["png"] }  # real art for the art-step tests (already in the tree)
