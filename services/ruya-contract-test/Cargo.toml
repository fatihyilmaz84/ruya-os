[package]
name = "ruya-contract-test"
description = "Test helper: compares the D-Bus interface a service serves with its api/dbus XML (RUY-403). A dev-dependency of every service, never shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
quick-xml = "0.37"  # reads the contract and zbus's introspection (already in the tree through ruya-store)
