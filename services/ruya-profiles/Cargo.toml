[package]
name = "ruya-profiles"
description = "RuyaOS profiles, PINs and the active profile (org.ruyaos.Profiles1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }  # OsRng for salts
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[dev-dependencies]
tempfile = "3"
