[package]
name = "ruya-profiles"
description = "RuyaOS profiles, PINs and the active profile (org.ruyaos.Profiles1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ruya-ids = { path = "../ruya-ids" }  # the one profile-id rule and profile user name (RUY-1008)
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }  # OsRng for salts
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# prctl(PR_SET_DUMPABLE, 0): no root peer reads the store through /proc/<pid>/root (RUY-1130); already in the tree
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
