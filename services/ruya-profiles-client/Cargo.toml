[package]
name = "ruya-profiles-client"
description = "RuyaOS: a service's view of org.ruyaos.Profiles1 (which profiles and guests exist, which is active), read once or followed"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"  # the retry timer while Profiles1 does not answer; already in the tree through zbus
