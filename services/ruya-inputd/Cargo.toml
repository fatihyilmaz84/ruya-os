[package]
name = "ruya-inputd"
description = "Ruya Input: gamepads to navigation keys for the shell and to per-profile virtual pads for apps (org.ruyaos.Input1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-channel = "2"  # router notices to the D-Bus signal task; already in the tree through zbus
sha2 = "0.10"  # stable device ids: SHA-256 of a machine salt and the serial/MAC (06-input.md §4.1)

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.12.2"
libc = "0.2"  # uinput, EVIOCSFF and xattr calls, the udev netlink monitor (already in the tree)

[dev-dependencies]
serde_json = "1"  # tests/profile_schema.rs: the profile schema v1 (06-input.md §7)
tempfile = "3"
