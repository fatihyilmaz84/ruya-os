[package]
name = "ruya-notifications"
description = "RuyaOS notification centre: per-profile history and settings (org.ruyaos.Notifications1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ruya-ids = { path = "../ruya-ids" }  # the one profile-id rule and profile user name (RUY-1008)
ruya-users = { path = "../ruya-users" }  # the ruya-shell uid from the one user-database lookup (RUY-1098)
ruya-profiles-client = { path = "../ruya-profiles-client" }  # reading and following Profiles1, shared with ruya-platform (RUY-1098)
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # the per-profile store files (already in the tree)
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
