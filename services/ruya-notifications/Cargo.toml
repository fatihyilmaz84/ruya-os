[package]
name = "ruya-notifications"
description = "RuyaOS notification centre: per-profile history and settings (org.ruyaos.Notifications1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # the per-profile store files (already in the tree)
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"  # the Profiles1 retry timer; already in the tree through zbus

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"  # getpwnam_r for the ruya-shell uid (already in the tree through ruya-session)

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
