[package]
name = "ruya-session"
description = "RuyaOS session: launch installed apps as a profile (org.ruyaos.Session1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"  # the stop-grace timer; already in the tree through zbus
async-channel = "2"  # unit events from the spawner to the adapter; already in the tree through zbus
async-lock = "3"  # Freeze and Thaw in the order they arrive (T-457); already in the tree through zbus
ruya-play-launch = { path = "../ruya-play-launch" }  # scan_in: the one runner scan (as ruya-library does since RUY-903), so Steam gets the runner the launcher would pick
ruya-play-format = { path = "../ruya-play-format" }  # resolve::compare_versions, the one version rule
ruya-fs = { path = "../ruya-fs" }  # every file in a profile's home or the service's state, never through a link (RUY-911)
libc = "0.2"  # localtime_r for the device time zone in the play ledger (already in the tree through ruya-update)

[dev-dependencies]
ruya-contract-test = { path = "../ruya-contract-test" }  # the served interface against api/dbus (RUY-403)
tempfile = "3"
