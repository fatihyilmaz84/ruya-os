# ruyaos-managed: grub-menu-custom.cfg
# Installed as /boot/grub2/custom.cfg by ruya-grub-menu.service (T-269). GRUB sources custom.cfg
# at the end of grub.cfg. Disks installed before the menu policy have a grub.cfg that shows the
# menu every boot and an image update does not rewrite it, so the policy is applied from here.
# Newer disks carry the same policy in grub.cfg itself (ruya_menu_policy=1) and skip this.
# By the time this runs, 08_greenboot.cfg has reset boot_success; a boot that never became
# healthy is recognised by greenboot's boot_counter, which stays set until the health check passes.
if [ -z "${ruya_menu_policy}" ]; then
  set timeout_style=hidden
  set timeout=2
  if [ -n "${boot_counter}" ]; then
    set timeout_style=menu
    set timeout=5
  fi
fi
