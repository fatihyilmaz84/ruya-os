# RuyaOS thermal policy (T-200): when the console counts as warm, hot or critical.
#
# Read by ruya-devices (org.ruyaos.Devices1.Thermal). To change a value, do not edit this file (the
# image replaces it on update): copy the lines you want to change into /etc/ruyaos/thermal.toml.
# A value in that file replaces the one here; everything it does not mention stays as below. A
# file with a typo, an unknown key or thresholds out of order is ignored as a whole (the reason is
# in the journal of ruya-devices), so a mistake never switches the protection off.
#
# Temperatures are degrees Celsius. What the shell does at each level (a status mark in Settings,
# a toast and the "performance" effects quality, a notice and stopping the apps and a power-off if
# it holds) is in docs/specs/01-platform.md, "Thermal policy".

# A level clears only when the reading is this many degrees below its threshold.
hysteresis = 5
# A level counts only after the reading has been at or above its threshold for this long.
debounce_seconds = 10
# A fan that was seen spinning and reads 0 rpm this long while the processor is warm or hotter
# makes the console "hot".
stuck_fan_seconds = 30
# For classes without a fixed "critical" below: critical is the sensor's own critical limit
# minus this margin, or critical_fallback when the sensor has no limit.
critical_margin = 5
critical_fallback = 100

# Processor package (coretemp, k10temp, thermal zone x86_pkg_temp).
[cpu]
warm = 80
hot = 90

# Graphics (amdgpu, nouveau, nvidia).
[gpu]
warm = 80
hot = 90

# NVMe drives and SATA SSDs.
[ssd]
warm = 70
hot = 75
critical = 80

# SATA hard disks (drivetemp).
[hdd]
warm = 50
hot = 55
critical = 60
