u ruya-shell - "RuyaOS shell" /var/lib/ruya-shell /usr/sbin/nologin
# ruya-library reads the system Flatpak installation; no home, no state.
u ruya-library - "RuyaOS library service" - /usr/sbin/nologin
# ruya-inputd (06-input.md section 3): /dev/uinput by group, physical pads by ACL; its state
# (the device-id salt) is the unit's StateDirectory.
u ruya-input - "RuyaOS input service" - /usr/sbin/nologin
# No video/render memberships: on bootc those groups live in /usr/lib/group, which sysusers
# cannot modify, and they are not needed. logind grants the seat0 session device access
# (uaccess ACLs on /dev/dri/*), verified on the first VM boot.
