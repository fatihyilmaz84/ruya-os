# RuyaOS boot menu policy (T-269), for disks installed from this image. It runs before
# 08_greenboot.cfg resets boot_success, so it sees how the previous boot ended.
#  - normal boot: no menu, a 2 s window in which Esc shows it (rollback stays reachable);
#  - previous boot never became healthy (boot_success=0, or greenboot's boot_counter is still set):
#    show the menu for 5 s so a broken deployment can be left by hand.
# ruya_menu_policy tells /boot/grub2/custom.cfg (written by ruya-grub-menu.service for disks whose
# grub.cfg is older than this file; a grub.cfg is not updated by an image update) not to repeat this.
set ruya_menu_policy=1
set timeout_style=hidden
set timeout=2
if [ "${boot_success}" = "0" -o -n "${boot_counter}" ]; then
  set timeout_style=menu
  set timeout=5
fi
