# Swap readahead for zram (RUY-530, docs/specs/01-platform.md 1.4). The only swap is zram, in RAM.
# The kernel default page-cluster = 3 reads and decompresses 8 pages on every swap-in, a readahead
# meant to save disk seeks; on zram there is no seek, so it only spends CPU and memory on pages that
# may never be used. 0 reads one page, as CachyOS does for zram. It matters most when a frozen,
# reclaimed game is thawed (T-466). vm.swappiness is not set: it stays at the kernel's 60.
vm.page-cluster = 0
