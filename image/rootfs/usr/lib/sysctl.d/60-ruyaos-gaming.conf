# Gaming kernel settings (RUY-527, docs/specs/01-platform.md 1.5). Sorts after Fedora's
# 10-map-count.conf, so these win. vm.swappiness is not set here: it stays at the kernel's 60.

# Windows titles under Proton/Wine map many regions (some need more than Fedora's 1048576, which
# 10-map-count.conf sets). SteamOS, Bazzite and CachyOS all use this value (the kernel maximum).
vm.max_map_count = 2147483642

# A game that does split-lock (misaligned atomic) accesses is slowed by about 10 ms per event on
# CPUs with split-lock detection (Intel Ice Lake / Alder Lake and later) while the kernel
# mitigation is on (default 1). 0 stops that, as SteamOS and Bazzite do. The price: this
# mitigation also protects against a local process slowing the whole machine with bus locks. That
# is accepted on a single-user console, where the only such process is the game in front
# (owner decision 2026-11-13, RUY-527). The leading "-" ignores a kernel without the setting.
-kernel.split_lock_mitigate = 0
