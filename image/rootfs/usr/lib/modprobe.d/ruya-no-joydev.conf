# No legacy joystick API (06-input.md section 3, RUY-3): Fedora's udev rule makes every
# /dev/input/js* node 0664, so with joydev loaded any user could read any pad, a physical one or
# another profile's virtual pad, past the ACLs on the event nodes. SDL, Wine and Proton use evdev.
blacklist joydev
install joydev /bin/false
