# ruya-play's state (docs/specs/05-play-packages.md section 7.1): root only. The service's own
# StateDirectory= creates the top folder too; these make the job folders exist from the first boot.
d /var/lib/ruya-play 0700 root root -
d /var/lib/ruya-play/incoming 0700 root root -
d /var/lib/ruya-play/state 0700 root root -
# staging/ and inspect/ moved to /var/lib/private/ruya-play-work by RUY-866 (05 section 7.3); consoles
# installed before keep the empty old folders, so they are removed at every boot.
R /var/lib/ruya-play/staging - - - -
R /var/lib/ruya-play/inspect - - - -
# The copy of each Inspect's vetted art that only the shell reads (RUY-1038): the vetted files live in
# root-only /var/lib/private/ruya-play-work, which ruya-shell cannot enter. The service makes inspect-<n>/
# below, root:ruya-shell 0750/0640, and empties it at start (05 section 7.3).
d /run/ruya-play 0750 root ruya-shell -
d /run/ruya-play/inspect 0750 root ruya-shell -
