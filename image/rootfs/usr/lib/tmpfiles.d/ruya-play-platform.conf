# The Play platform on /usr (ADR-038, docs/specs/05-play-packages.md section 6.4). The .play launcher
# and the image's system runners are files in the signed image; Flatpak mounts them into every .play
# app as unmaintained extensions through these links, made again at every boot, so an OS update or
# rollback reaches each app at its next run (proven in the VM, RUY-899). Nothing is committed or signed.
L+ /var/lib/flatpak/extension/org.ruyaos.Play.Launcher/x86_64/1 - - - - /usr/lib/ruyaos/play/launcher
# One line per folder of image/play/runners/ (org.ruyaos.Play.Runner.<Name>, branch 1 the ABI);
# services/ruya-play/tests/platform.rs fails when a folder has no line or a line no folder.
L+ /var/lib/flatpak/extension/org.ruyaos.Play.Runner.ProtonGE11/x86_64/1 - - - - /usr/lib/ruyaos/play/runners/ProtonGE11
L+ /var/lib/flatpak/extension/org.ruyaos.Play.Runner.Wine11/x86_64/1 - - - - /usr/lib/ruyaos/play/runners/Wine11
# The same trees for Steam (RUY-35, ADR-038 "Steam"): one more line per Proton runner (a folder with
# GE-Proton's own compatibilitytool.vdf), into the extension point of Steam's Flathub manifest,
#   com.valvesoftware.Steam.CompatibilityTool: subdirectories: true, directory:
#   share/steam/compatibilitytools.d, version: stable
# so Steam lists the tool; ruya-session makes it the default once per profile (steam_tool.rs).
L+ /var/lib/flatpak/extension/com.valvesoftware.Steam.CompatibilityTool.ProtonGE11/x86_64/stable - - - - /usr/lib/ruyaos/play/runners/ProtonGE11
