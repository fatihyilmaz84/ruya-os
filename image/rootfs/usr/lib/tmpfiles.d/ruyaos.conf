d /var/lib/ruya-shell 0750 ruya-shell ruya-shell -
d /var/lib/ruyaos 0755 root root -
# The PIN store's own directory (RUY-1130): made at boot, before any service starts, because every
# other root ruya-* unit names it in InaccessiblePaths= and a missing path fails that unit. It
# belongs to ruya-profiles, which runs as its own user (ADR-049; sysusers runs before tmpfiles).
d /var/lib/ruyaos/profiles 0700 ruya-profiles ruya-profiles -
d /run/ruya-pulse 0711 ruya-shell ruya-shell -
# Root's markers for the parentless input devices it made and vouches for (06-input.md section 3
# rule 1, RUY-1063): only root may write here; the udev rules treat a marked device as hardware.
d /run/ruya-input-trusted 0755 root root -
