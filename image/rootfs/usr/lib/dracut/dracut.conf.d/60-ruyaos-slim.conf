# fedora-bootc's dracut config asks for modules (30-bootc-standard.conf: lvm; 50-bootc-clevis.conf:
# clevis) whose tools image/build/50-slim.sh removes (T-195); dracut stops with "Module 'lvm'
# cannot be installed". Omit them: this image has a plain xfs root and no clevis-bound LUKS.
omit_dracutmodules+=" lvm clevis clevis-pin-tpm2 "
