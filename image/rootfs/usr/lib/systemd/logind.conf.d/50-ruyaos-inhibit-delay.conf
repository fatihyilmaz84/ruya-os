# RUY-888: before the system goes down, ruya-session stops every app the way Close game does
# (a frozen one is thawed first, then SIGTERM, then the 30 s backstop's SIGKILL; an app registered
# with Platform1 gets up to 5 s to save first, counted inside those 30 s, RUY-1099). It holds logind's
# shutdown delay lock until they have ended, at most 35 s (STOP_ALL_WAIT in ruya-session's
# shutdown.rs). logind's default of 5 s would cut a game that saves slowly short; this is the most
# logind waits, used only while a game is still quitting.
[Login]
InhibitDelayMaxSec=40
