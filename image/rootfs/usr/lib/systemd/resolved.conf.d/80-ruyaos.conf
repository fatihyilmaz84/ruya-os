# RuyaOS (RUY-18, 01-platform.md section 3): no name-resolution responder on the network.
# LLMNR answered on tcp/udp 5355 on every interface; a console needs neither LLMNR nor resolved's
# mDNS (if the browser interface of ADR-029 ever announces ruya.local, Avahi does it, not resolved).
# The loopback stub (127.0.0.53/127.0.0.54:53) stays. An admin can override this in /etc.
[Resolve]
LLMNR=no
MulticastDNS=no
