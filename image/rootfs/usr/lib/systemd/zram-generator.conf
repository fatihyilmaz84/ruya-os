# RuyaOS swap (T-465, docs/specs/01-platform.md 1.4): one compressed swap device in RAM, no swap file.
# Same path as the file Fedora's zram-generator-defaults package ships (that package is not installed;
# its size is min(ram, 8192) and its algorithm is the kernel default, lzo-rle). A frozen game keeps all its
# memory (T-464); with this the kernel can push it out compressed (zstd measured 3.1x on a frozen game).
# To change it on one machine, put a file with the same name in /etc/systemd/ (an empty one turns zram off).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
