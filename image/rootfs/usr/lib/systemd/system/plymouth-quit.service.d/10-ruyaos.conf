# Quit the splash with --retain-splash (T-269): Plymouth is asked not to clear the screen when it goes.
# On a driver whose console framebuffer takes over the display this keeps the last splash frame
# until the shell's first frame. Measured in the QEMU VM (virtio-vga, no fbdev console afterwards):
# the display goes dark when Plymouth closes the DRM device whatever the option, until the shell
# draws; hardware (Dell) is not measured yet. ruya-compositor@.service starts after
# plymouth-quit-wait (Plymouth gone), because eglfs only gets the display when nobody else holds it.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
