# bluetoothd runs even before an adapter exists (T-173): the stock unit is skipped while
# /sys/class/bluetooth is missing, then org.bluez is absent and ruya-devices has nothing to ask
# (a VM, or a USB adapter plugged in later). Without an adapter bluetoothd only idles.
# An empty Condition*= resets the unit's whole condition list, of every kind (systemd.unit(5));
# the stock unit has only this one, so nothing else is dropped. Re-check after a bluez update.
[Unit]
ConditionPathIsDirectory=
