# Load the NT synchronisation driver at boot (RUY-525, docs/specs/01-platform.md 1.5).
# The kernel builds it as a module (CONFIG_NTSYNC=m) and the image ships ntsync.ko, but nothing
# loads it, so /dev/ntsync did not exist. GE-Proton (the Windows runner, ADR-025) uses ntsync
# when that device exists and falls back to fsync otherwise; SteamOS loads it by default.
ntsync
