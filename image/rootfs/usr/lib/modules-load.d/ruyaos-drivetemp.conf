# Load the drive temperature hwmon driver at boot (RUY-737, docs/specs/01-platform.md 2).
# The kernel builds it as a module (CONFIG_SENSORS_DRIVETEMP=m) but nothing loads it, so a SATA drive
# had no hwmon device and Settings > System > Device health listed no temperature for it. NVMe
# drives have their own hwmon and need nothing. ruya-devices (thermal.rs) already reads it.
drivetemp
