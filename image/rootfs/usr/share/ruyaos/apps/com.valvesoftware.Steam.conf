# The image's per-app table, one file per Flatpak id (ADR-043; services/ruya-session/src/apps.rs;
# spec 03). A new per-app behaviour becomes a key here, never a new file.

[App]
# Steam always opens in Big Picture (owner, 2026-11-17): one fullscreen, controller-first window.
# Its desktop mode opens several windows (main, friends list) of which the console shows one.
args=-gamepadui
# The Steam client is X11-only. In Wayland mode it gets no DISPLAY and stops with
# "requires a correctly-configured desktop session" (Dell, 2026-11-17, lead-30), although its
# Flatpak metadata also lists the wayland socket.
display=x11
# A Freeze of Steam freezes its games and never Steam itself (ADR-042): the client keeps its
# connection while the Hub pauses, and its sound is parked (the instance is held, not frozen).
freeze=never
# Steam's games are child instances of Steam's (RUY-1052, ADR-041).
children=steam
