# The pulse server of one profile's apps (ruya-pulse@.service, ADR-010, T-365). A trimmed copy
# of Fedora's pipewire-pulse.conf: it listens only on "unix:native" in PULSE_RUNTIME_PATH, the
# profile's own directory, refuses module loading from clients (an app could otherwise load a
# TCP server or a pipe sink running with the shell's rights), and loads none of the pulse.cmd
# helper modules (the shell's own pulse server already does that for the console).
context.properties = {
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level   = -11
            rtportal.enabled = false
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse
        args = {
        }
    }
]

context.exec = [
]

pulse.cmd = [
]

stream.properties = {
}

pulse.properties = {
    server.address = [
        "unix:native"
    ]
    # The shell's pulse server owns org.pulseaudio.Server; this one needs no D-Bus name.
    server.dbus-name = ""
    pulse.allow-module-loading = false
    # RUY-425: a stream that has underrun for 5 s is paused until the app writes again. A game the
    # Ruya Hub froze stops writing, but an unpaused stream with prebuf 0 (OpenAL-soft's) is still
    # read, and every quantum the server asks the frozen app for one more quantum of sound. At the
    # thaw the app gets all of it at once (2 h: about 2.6 GB of float stereo) and libpulse aborts
    # (memblock.c stat_remove). Paused, the ask stops at about 5 s of sound, however long the
    # freeze. Fedora's pipewire-pulse.conf sets the same for speech-dispatcher.
    pulse.idle.timeout = 5
}

pulse.properties.rules = [
    {   matches = [ { cpu.vm.name = !null } ]
        actions = {
            update-props = {
                pulse.min.quantum = 1024/48000
            }
        }
    }
]
