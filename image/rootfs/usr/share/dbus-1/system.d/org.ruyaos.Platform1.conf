<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- org.ruyaos.Platform1, the one door for sandboxed apps (ADR-022, RUY-157).
     Only root owns the name. Root and the shell may call it, except NotifyLifecycle, which is
     root only (ruya-session). Every other user (a profile's apps, through xdg-dbus-proxy) may
     call only the public interface org.ruyaos.Platform1.Lifecycle and receive only its signals,
     which the service sends unicast to the app's own registered connections. Manage stays closed
     to them. The service identifies every Lifecycle caller from its connection and checks the
     Manage caller's uid itself as well. This is the one default-context allow on the system bus:
     image/security-baseline.json "public_bus_doors" names it, and lint-bus-policies.ps1 and
     vm-security-check.sh busrecv refuse any other. In dbus policy the last matching rule wins, so
     the allows come after the denies. -->
<busconfig>
  <policy user="root">
    <allow own="org.ruyaos.Platform1"/>
    <allow send_destination="org.ruyaos.Platform1"/>
    <allow receive_sender="org.ruyaos.Platform1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Platform1"/>
    <allow receive_sender="org.ruyaos.Platform1" receive_type="signal"/>
    <deny send_destination="org.ruyaos.Platform1" send_member="NotifyLifecycle"/>
  </policy>
  <policy context="default">
    <deny own="org.ruyaos.Platform1"/>
    <deny send_destination="org.ruyaos.Platform1"/>
    <deny receive_sender="org.ruyaos.Platform1" receive_type="signal"/>
    <allow send_destination="org.ruyaos.Platform1" send_interface="org.ruyaos.Platform1.Lifecycle" send_type="method_call"/>
    <allow receive_sender="org.ruyaos.Platform1" receive_interface="org.ruyaos.Platform1.Lifecycle" receive_type="signal"/>
  </policy>
</busconfig>
