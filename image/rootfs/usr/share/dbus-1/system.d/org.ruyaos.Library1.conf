<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only the service's own user may own the name; only the shell (and root) may call it. -->
<!-- PutProfileItems and SetActiveProfile are root only (ruya-session, ADR-045): denied to the shell
     after its allow (the last matching rule wins); the service checks the caller's uid as well. -->
<!-- Its signals are broadcasts: without a receive rule any client can match them. Only the shell
     and root receive them (RUY-594); the rest are denied (signals only, so a method reply is untouched). -->
<busconfig>
  <policy user="ruya-library">
    <allow own="org.ruyaos.Library1"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.ruyaos.Library1"/>
    <allow receive_sender="org.ruyaos.Library1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Library1"/>
    <allow receive_sender="org.ruyaos.Library1" receive_type="signal"/>
    <deny send_destination="org.ruyaos.Library1" send_interface="org.ruyaos.Library1" send_member="PutProfileItems"/>
    <deny send_destination="org.ruyaos.Library1" send_interface="org.ruyaos.Library1" send_member="SetActiveProfile"/>
  </policy>
  <policy context="default">
    <deny own="org.ruyaos.Library1"/>
    <deny send_destination="org.ruyaos.Library1"/>
    <deny receive_sender="org.ruyaos.Library1" receive_type="signal"/>
  </policy>
</busconfig>
