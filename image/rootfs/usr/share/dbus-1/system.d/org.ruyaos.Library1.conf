<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only the service's own user may own the name; only the shell (and root) may call it. -->
<busconfig>
  <policy user="ruya-library">
    <allow own="org.ruyaos.Library1"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.ruyaos.Library1"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Library1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ruyaos.Library1"/>
  </policy>
</busconfig>
