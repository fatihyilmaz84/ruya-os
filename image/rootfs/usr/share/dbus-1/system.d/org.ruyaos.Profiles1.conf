<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; only the shell (and root) may call it. -->
<!-- Its signals are broadcasts: without a receive rule any client can match them. Only the shell
     and root receive them (RUY-594); the rest are denied (signals only, so a method reply is untouched). -->
<busconfig>
  <policy user="root">
    <allow own="org.ruyaos.Profiles1"/>
    <allow send_destination="org.ruyaos.Profiles1"/>
    <allow receive_sender="org.ruyaos.Profiles1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Profiles1"/>
    <allow receive_sender="org.ruyaos.Profiles1" receive_type="signal"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ruyaos.Profiles1"/>
    <deny receive_sender="org.ruyaos.Profiles1" receive_type="signal"/>
  </policy>
</busconfig>
