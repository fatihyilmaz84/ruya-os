<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; only the shell (and root) may call it. -->
<!-- Its signals are broadcasts: without a receive rule any client can match them. Only the shell
     and root receive them (RUY-594); the rest are denied (signals only, so a method reply is untouched). -->
<busconfig>
  <policy user="root">
    <allow own="org.ruyaos.Session1"/>
    <allow send_destination="org.ruyaos.Session1"/>
    <allow receive_sender="org.ruyaos.Session1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Session1"/>
    <allow receive_sender="org.ruyaos.Session1" receive_type="signal"/>
  </policy>
  <!-- ruya-library may send Session1's connection one broadcast, Library1.ProfileScanWanted (ADR-045 amendment):
       dbus-broker checks a signal's send rules against each receiver's names, so the default deny below would
       drop it. Signal only, one member: no method call, no other signal. Declared in
       image/security-baseline.json "service_signals" and enforced by scripts/lint-bus-policies.ps1. -->
  <policy user="ruya-library">
    <allow send_destination="org.ruyaos.Session1" send_type="signal" send_path="/org/ruyaos/Library1" send_interface="org.ruyaos.Library1" send_member="ProfileScanWanted"/>
  </policy>
  <policy context="default">
    <deny own="org.ruyaos.Session1"/>
    <deny send_destination="org.ruyaos.Session1"/>
    <deny receive_sender="org.ruyaos.Session1" receive_type="signal"/>
  </policy>
</busconfig>
