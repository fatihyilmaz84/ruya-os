<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name; only the shell (and root) may call it (RUY-730). The service also
     checks the caller of Post and Withdraw itself (defence in depth). -->
<!-- Its signals are broadcasts (Added carries a title and body): without a receive rule any client
     can match them. Only the shell and root receive them (RUY-594); the rest are denied (signals
     only, so a method reply is untouched). -->
<busconfig>
  <policy user="root">
    <allow own="org.ruyaos.Notifications1"/>
    <allow send_destination="org.ruyaos.Notifications1"/>
    <allow receive_sender="org.ruyaos.Notifications1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Notifications1"/>
    <allow receive_sender="org.ruyaos.Notifications1" receive_type="signal"/>
  </policy>
  <policy context="default">
    <deny own="org.ruyaos.Notifications1"/>
    <deny send_destination="org.ruyaos.Notifications1"/>
    <deny receive_sender="org.ruyaos.Notifications1" receive_type="signal"/>
  </policy>
</busconfig>
