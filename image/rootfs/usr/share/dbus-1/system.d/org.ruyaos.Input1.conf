<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only the service's own user may own the name; only the shell (and root) may call it
     (06-input.md section 5.2). ruya-link gets nothing until ADR-029's allow-list names a method. -->
<!-- Its signals are broadcasts: without a receive rule any client can match them. Only the shell
     and root receive them (RUY-594); the rest are denied (signals only, so a method reply is untouched). -->
<busconfig>
  <policy user="ruya-input">
    <allow own="org.ruyaos.Input1"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.ruyaos.Input1"/>
    <allow receive_sender="org.ruyaos.Input1" receive_type="signal"/>
  </policy>
  <policy user="ruya-shell">
    <allow send_destination="org.ruyaos.Input1"/>
    <allow receive_sender="org.ruyaos.Input1" receive_type="signal"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ruyaos.Input1"/>
    <deny receive_sender="org.ruyaos.Input1" receive_type="signal"/>
  </policy>
</busconfig>
