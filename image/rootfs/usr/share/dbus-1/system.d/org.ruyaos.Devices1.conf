<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ADR-010: ruya-devices runs as a user unit of ruya-shell, so ruya-shell owns the name.
     Only the shell (and root) may call it. Its Bluetooth part calls org.bluez as ruya-shell; BlueZ's
     own policy (bluetooth.conf, bluez 5.87 on Fedora 44) allows every user to send to org.bluez in
     its default context, so nothing is needed here for that (T-173). -->
<!-- Its signals are broadcasts: without a receive rule any client can match them. Only the shell
     and root receive them (RUY-594); the rest are denied (signals only, so a method reply is untouched). -->
<busconfig>
  <policy user="ruya-shell">
    <allow own="org.ruyaos.Devices1"/>
    <allow send_destination="org.ruyaos.Devices1"/>
    <allow receive_sender="org.ruyaos.Devices1" receive_type="signal"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.ruyaos.Devices1"/>
    <allow receive_sender="org.ruyaos.Devices1" receive_type="signal"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ruyaos.Devices1"/>
    <deny receive_sender="org.ruyaos.Devices1" receive_type="signal"/>
  </policy>
</busconfig>
