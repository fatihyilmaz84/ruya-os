<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ADR-010: ruya-devices runs as a user unit of ruya-shell, so ruya-shell owns the name.
     Only the shell (and root) may call it. The same service drives BlueZ for the Bluetooth pane (T-173):
     BlueZ's own policy only lets root and the group bluetooth call org.bluez, so ruya-shell is
     allowed to here (and to nothing else of BlueZ's: owning the name stays with root). -->
<busconfig>
  <policy user="ruya-shell">
    <allow own="org.ruyaos.Devices1"/>
    <allow send_destination="org.ruyaos.Devices1"/>
    <allow send_destination="org.bluez"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.ruyaos.Devices1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.ruyaos.Devices1"/>
  </policy>
</busconfig>
