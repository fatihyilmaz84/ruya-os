# RuyaOS (T-320): a console is plugged into a TV or a monitor, so the HDMI/DisplayPort audio profile of
# the PCH sound card wins when it is available, and WirePlumber falls back to its own best profile when
# it is not (no display attached, or no audio on the cable). Without this the Dell OptiPlex 7080 came up
# on "Analog Stereo Duplex": the only sink was the unused headphone jack, so every cue and the ambient
# bed played into nothing while the monitor (G32QC) had a valid ELD and an unused HDMI profile.
# `device.profile` is read by device/find-best-profile.lua and takes priority "if available or unknown".
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-*" }
    ]
    actions = {
      update-props = {
        device.profile = "output:hdmi-stereo+input:analog-stereo"
      }
    }
  }
]
