# RuyaOS (T-375): Classic Bluetooth HID (DualSense, DualShock 4, Switch Pro, most pads) goes
# through the kernel's hidp, not through bluetoothd and /dev/uhid. BlueZ's default
# (UserspaceHID=true) made the single-threaded daemon relay every input report, about 730 a
# second for a DualSense, at 10-12 % of a core on the Dell. BLE (HoG) devices use uhid anyway.
[General]
UserspaceHID=false
