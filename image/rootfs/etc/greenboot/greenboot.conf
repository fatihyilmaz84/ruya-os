# RuyaOS greenboot configuration (replaces the package default).

## A deployment that fails the required health checks this many boots in a row is rolled back.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

## Stock checks from greenboot-default-health-checks that do not apply to RuyaOS:
## - 01_repository_dns_check.sh (required) checks that update repositories resolve over DNS. A
##   console may boot without network, which would make every offline boot "unhealthy" and roll
##   back good images. RuyaOS updates come from a container registry and are checked by ruya-update.
## - 01_update_platforms_check.sh (wanted) curls the URLs in /etc/ostree/remotes.d, the ostree
##   remotes of rpm-ostree systems. A bootc console has none, so it failed on every boot (T-160).
## The stock 02_watchdog.sh (required) stays.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")
