# RuyaOS greenboot configuration (replaces the package default).

## A deployment that fails the required health checks this many boots in a row is rolled back.
GREENBOOT_MAX_BOOT_ATTEMPTS=3

## 01_repository_dns_check.sh checks that update repositories resolve over DNS. A console may
## boot without network, which would make every offline boot "unhealthy" and roll back good
## images. RuyaOS updates come from a container registry and are checked by ruya-update.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh")
